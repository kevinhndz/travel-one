<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Admin Login</title></head>
<body style="font-family:sans-serif;max-width:400px;margin:80px auto">
  <h2>🔐 Panel Admin - Travel One</h2>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST">
    <input name="user" placeholder="Usuario" required><br><br>
    <input name="password" type="password" placeholder="Contraseña" required><br><br>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
